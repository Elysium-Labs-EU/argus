name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # go-crap-gate diffs against origin/main; needs full history

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dev tools
        run: make setup

      - name: Run CI gate
        run: make ci

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: argus-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: argus-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: argus-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: argus-darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Get version info
        id: info
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags="-X 'github.com/Elysium-Labs-EU/argus/internal/buildinfo.Version=${{ steps.info.outputs.version }}' \
              -X 'github.com/Elysium-Labs-EU/argus/internal/buildinfo.GitCommit=${{ steps.info.outputs.commit }}' \
              -X 'github.com/Elysium-Labs-EU/argus/internal/buildinfo.BuildDate=${{ steps.info.outputs.date }}' \
              -w -s" \
            -o ${{ matrix.artifact }} .

      - name: Verify binary
        run: |
          ls -lh ${{ matrix.artifact }}
          file ${{ matrix.artifact }}

      # Ad-hoc signing (no Developer ID cert, no notarization — none provisioned
      # yet). This doesn't remove the Gatekeeper prompt on a manually downloaded
      # binary, but it upgrades the failure mode from a hard SIGKILL/"cannot be
      # opened" to the softer "unidentified developer" dialog with an explicit
      # Allow path in System Settings. See issue #47.
      - name: Ad-hoc codesign (macOS only)
        if: matrix.goos == 'darwin'
        run: codesign --force -s - ${{ matrix.artifact }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "argus-*" -exec cp {} release/ \;
          ls -lh release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum argus-* > sha256sums.txt
          cat sha256sums.txt

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd release
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY secret is not set — skipping release signing."
            echo "Clients only warn on a missing signature right now (see requireReleaseSignature"
            echo "in cmd/update.go), but that's meant to flip to a hard failure once this secret"
            echo "is provisioned and a signed release has shipped. Provision it before then."
            exit 0
          fi
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out sha256sums.txt.sig sha256sums.txt
          echo "Signed sha256sums.txt -> sha256sums.txt.sig"

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Renders Formula/argus.rb for elysium-labs/homebrew-tap from this
      # release's checksums. GITHUB_TOKEN is scoped to this repo only, not
      # the tap repo, so pushing there would need a separate PAT/GH App
      # token that isn't provisioned yet; attach as a release asset instead
      # for a maintainer to copy over by hand.
      - name: Generate Homebrew formula
        run: |
          scripts/gen-homebrew-formula.sh "${{ steps.version.outputs.version }}" release/sha256sums.txt > release/argus.rb
          cat release/argus.rb

      - name: Determine if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            release/argus-linux-amd64
            release/argus-linux-arm64
            release/argus-darwin-amd64
            release/argus-darwin-arm64
            release/sha256sums.txt*
            release/argus.rb
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            ## argus ${{ steps.version.outputs.version }}

            Deterministic supervisor for multi-agent AI coding workflows.

            ### Install

            ```bash
            curl -sSfL https://raw.githubusercontent.com/Elysium-Labs-EU/argus/main/scripts/install.sh | sh
            ```

            No sudo required on most machines — installs to `~/.local/bin` when
            it's on `PATH`, otherwise `/usr/local/bin` (sudo only as a last
            resort). Set `ARGUS_INSTALL_DIR` to pick another directory.

            ### Manual Installation

            Download the binary for your platform:
            - **Linux AMD64**: `argus-linux-amd64`
            - **Linux ARM64**: `argus-linux-arm64`
            - **macOS (Apple Silicon)**: `argus-darwin-arm64`
            - **macOS (Intel)**: `argus-darwin-amd64`

            Then, without sudo, move it onto a directory already on your
            `PATH` (e.g. `~/.local/bin`):
            ```bash
            chmod +x argus-<platform>
            mv argus-<platform> ~/.local/bin/argus
            ```
            Or, if you have root: `sudo mv argus-<platform> /usr/local/bin/argus`.

            ### Verify Download

            Check `sha256sums.txt` against the binary you downloaded:
            ```bash
            sha256sum -c sha256sums.txt --ignore-missing
            ```

            This confirms the download wasn't corrupted or tampered with in transit — it is not a cryptographic signature over who built it. Binary signing is planned once a signing key is provisioned.

            See the [README](https://github.com/Elysium-Labs-EU/argus/blob/main/README.md) for full documentation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Gitleaks

# Secret exposure risk is introduced by new commits, not by time passing, so
# scan on every push/PR rather than on a schedule (unlike osv-scan.yml, which
# also needs a weekly run to catch newly-published CVEs against unchanged
# deps — not applicable here).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the merge commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

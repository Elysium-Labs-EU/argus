# CHANGELOG.md is generated by git-cliff from commit history; its embedded
# commit hashes and PR titles trip the dictionary on things no author wrote
# by hand (e.g. a hash fragment that happens to spell "ba").
[files]
extend-exclude = ["CHANGELOG.md"]

[default.extend-words]
# Valid alternate spelling used throughout this codebase; not a typo of
# "unparsable".
unparseable = "unparseable"
# Short local identifiers that collide with the dictionary's fuzzy matches.
ue = "ue"
mis = "mis"

# yaml-language-server: $schema=https://raw.githubusercontent.com/Elysium-Labs-EU/argus/main/schemas/config.schema.json
# .argus/config.yml — all keys are optional; see `argus init`.
base_branch: "main"
worker_placement: "tab"
launcher: "claude --permission-mode dontAsk --model sonnet"
phases:
  working:
    allow:
      - "Bash(make *)"
      - "Bash(go build*)"
      - "Bash(go test*)"
      - "Bash(go vet*)"
      - "Bash(go run*)"
      - "Bash(go mod*)"
      - "Bash(go tool*)"
      - "Bash(gofmt*)"
  self_test:
    allow:
      - "Bash(make *)"
      - "Bash(go build*)"
      - "Bash(go test*)"
      - "Bash(go vet*)"
      - "Bash(go run*)"
      - "Bash(go mod*)"
      - "Bash(go tool*)"
      - "Bash(gofmt*)"
brief_note: "Comments must be terse and explain WHY (a hidden constraint, subtle invariant, non-obvious reasoning), never WHAT the code already makes obvious. Never cite issue or ticket numbers in comments - that context belongs in the PR description and commit message, not source code.\n\nARCHITECTURE DECISIONS: docs/adr/ is this repo's permanent design record, and an accepted ADR is binding. Before you write code, run `make adr-find Q=\"<your topic>\"` and read whatever it returns; silently contradicting an accepted ADR is a request-changes. If your change MAKES a design decision - replaces a heuristic, introduces a new concept into the model, changes a contract, or rejects an alternative for a stated reason - write an ADR in the same diff: next sequential number, the format defined by docs/adr/0001-record-architecture-decisions.md (Context, Decision, Rejected, Consequences; bullets not prose; 15 to 30 lines; no issue numbers). A bug fix that follows an existing pattern does not need one. Either way, state in your report which case applies and why. Reversing an accepted ADR means a NEW ADR that supersedes it; never edit or delete an accepted file."
ship:
  verify_command: "make ci"

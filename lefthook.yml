pre-commit:
  commands:
    format:
      glob: "*.go"
      run: golangci-lint fmt && git add {staged_files}
      priority: 1

    lint:
      glob: "*.go"
      run: golangci-lint run --timeout=5m
      priority: 2

    fieldalignment:
      glob: "*.go"
      run: go tool fieldalignment ./...
      priority: 2

    test:
      glob: "*.go"
      # git exports GIT_DIR et al. into this hook's own environment; unset
      # them before go test starts so an inherited value can't silently
      # override an explicit `git -C <dir>` in a fixture the tests spawn.
      run: unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; go test -short ./...
      priority: 3

pre-push:
  commands:
    # A single `make crap` call: its own test-coverage-check prerequisite
    # generates coverage.out exactly once, and go-crap now scores off that
    # same file (see scripts/go-crap-gate.sh). Running coverage and crap as
    # two separate lefthook commands meant two separate `make` processes,
    # each re-running `go test` independently -- two coverage samples with
    # no guarantee they'd agree with each other or with a prior gate-verify
    # run of `make ci`.
    crap:
      glob: "*.go"
      run: make crap

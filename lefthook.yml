pre-commit:
  commands:
    # GOLANGCI_LINT_CACHE is set inline rather than inherited from the Makefile:
    # these invoke golangci-lint directly, so the Makefile's export never reaches
    # them. Without it they fall back to the one shared per-user cache, which is
    # keyed on file content - identical sources in two worktrees collide and one
    # tree is served the other's stored findings. That matters most here, since
    # this hook decides whether a commit is allowed. show-toplevel resolves to
    # the linked worktree's own root, so each tree isolates itself.
    format:
      glob: "*.go"
      run: GOLANGCI_LINT_CACHE="$(git rev-parse --show-toplevel)/.cache/golangci-lint" golangci-lint fmt && git add {staged_files}
      priority: 1

    lint:
      glob: "*.go"
      run: GOLANGCI_LINT_CACHE="$(git rev-parse --show-toplevel)/.cache/golangci-lint" golangci-lint run --timeout=5m
      priority: 2

    fieldalignment:
      glob: "*.go"
      run: go tool fieldalignment ./...
      priority: 2

    test:
      glob: "*.go"
      # git exports GIT_DIR et al. into this hook's own environment; unset
      # them before go test starts so an inherited value can't silently
      # override an explicit `git -C <dir>` in a fixture the tests spawn.
      run: unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_PREFIX GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; go test -short ./...
      priority: 3

pre-push:
  commands:
    # A single `make crap` call: its own test-coverage-check prerequisite
    # generates coverage.out exactly once, and go-crap now scores off that
    # same file (see scripts/go-crap-gate.sh). Running coverage and crap as
    # two separate lefthook commands meant two separate `make` processes,
    # each re-running `go test` independently -- two coverage samples with
    # no guarantee they'd agree with each other or with a prior gate-verify
    # run of `make ci`.
    crap:
      glob: "*.go"
      run: make crap
